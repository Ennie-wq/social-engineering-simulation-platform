Example 

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Awareness Simulation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0,0,0,.1);
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
        }

        p {
            color: #666;
            line-height: 1.5;
        }

        .notice {
            padding: 12px;
            background: #f1f3f5;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            opacity: .9;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Security Awareness Simulation</h1>

    <div class="notice">
        This is a controlled security-awareness simulation.
    </div>

    <p>
        This demonstration page is used to measure interaction with a
        simulated security scenario.
    </p>

    <button onclick="recordInteraction()">
        Continue
    </button>

</div>

<script>
function recordInteraction() {

    fetch("../backend/response.php", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: "event=simulation_interaction"
    })
    .then(response => response.text())
    .then(() => {
        alert("Simulation interaction recorded.");
    })
    .catch(() => {
        alert("Unable to contact telemetry server.");
    });
}
</script>

</body>
</html>
